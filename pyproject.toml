[project]
name = "payments-rag"
version = "0.1.0"
description = "RAG Q&A assistant over public payments standards documents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "fastembed>=0.9.1",
    "psycopg[binary]>=3.3.9",
    "pgvector>=0.5.1",
    "anthropic>=2.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]
eval = [
    "deepeval>=4.3.4",
    "typesafe-sdk>=0.7.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payments_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
