[project]
name = "payments-rag-infra"
version = "0.1.0"
description = "AWS CDK stack for the payments standards assistant (serverless: CloudFront, Lambda, DynamoDB)"
requires-python = ">=3.11"
dependencies = [
    "aws-cdk-lib>=2.170,<3",
    "constructs>=10.3,<11",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
