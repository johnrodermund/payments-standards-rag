services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://payments:payments@db:5432/payments
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
      AWS_REGION: ${AWS_REGION:-us-east-1}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments"]
      interval: 5s
      timeout: 3s
      retries: 10

  phoenix:
    image: arizephoenix/phoenix:latest
    # Local development only. Phoenix 21+ requires authentication by default in Docker. It is turned off here
    # and the port is bound to loopback so only this machine can reach it. For anything shared or deployed,
    # remove PHOENIX_ENABLE_AUTH, set PHOENIX_SECRET, create an API key and give it to the app as PHOENIX_API_KEY.
    environment:
      PHOENIX_ENABLE_AUTH: "false"
    ports:
      - "127.0.0.1:6006:6006"

volumes:
  pgdata:
